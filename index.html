<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entra negli Illuminati</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:"Courier New",monospace;color:#56ff79}
canvas{position:fixed;inset:0;width:100%;height:100%}
.wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle,rgba(0,255,70,.08),transparent 45%)}
h1{position:relative;margin:0;max-width:1100px;font-size:clamp(2.5rem,8vw,7rem);line-height:.95;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 7px #36ff66,0 0 28px rgba(54,255,102,.45);animation:flicker 4s infinite}
h1:before,h1:after{content:"ENTRA NEGLI ILLUMINATI";position:absolute;inset:0;pointer-events:none}
h1:before{opacity:.4;transform:translate(3px,-2px);clip-path:inset(8% 0 68% 0);animation:g1 1.7s steps(2,end) infinite}
h1:after{opacity:.3;transform:translate(-3px,2px);clip-path:inset(62% 0 10% 0);animation:g2 1.3s steps(2,end) infinite}
@keyframes flicker{0%,17%,19%,22%,100%{opacity:1}18%,21%{opacity:.72}}
@keyframes g1{0%,90%,100%{transform:translate(0)}92%{transform:translate(7px,-2px)}95%{transform:translate(-5px,2px)}}
@keyframes g2{0%,84%,100%{transform:translate(0)}86%{transform:translate(-6px,1px)}90%{transform:translate(4px,-2px)}}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0,rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px)}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="wrap"><h1>ENTRA NEGLI ILLUMINATI</h1></div>
<div class="scan"></div>
<script>
const c=document.getElementById("matrix"),x=c.getContext("2d");
const chars="01ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソ";
let drops=[],fs=18,w=0,h=0;
function resize(){
  const d=devicePixelRatio||1;
  w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;c.style.width=w+"px";c.style.height=h+"px";
  x.setTransform(d,0,0,d,0,0);
  drops=Array(Math.ceil(w/fs)).fill(0).map(()=>Math.random()*-60);
}
function draw(){
  x.fillStyle="rgba(0,0,0,.075)";x.fillRect(0,0,w,h);x.font=fs+"px monospace";
  for(let i=0;i<drops.length;i++){
    x.fillStyle=Math.random()>.975?"#d9ffe1":"#21df50";
    x.fillText(chars[(Math.random()*chars.length)|0],i*fs,drops[i]*fs);
    if(drops[i]*fs>h&&Math.random()>.975)drops[i]=Math.random()*-30;
    drops[i]+=.7+Math.random()*.4;
  }
  requestAnimationFrame(draw);
}
addEventListener("resize",resize);resize();draw();
</script>
</body>
</html>
